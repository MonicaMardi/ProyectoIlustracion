<!doctype html>

      </div>
      <nav class="navbar" aria-label="Navegacion principal">
        <ul class="nav-links">
          <li>
            <a class="nav-link active" href="Index.html" aria-current="page"
              >Inicio</a
            >
          </li>
          <li class="dropdown">
            <a
              class="nav-link dropdown-toggle"
              href="../Catalogo/catalogo.html"
              aria-haspopup="true"
              aria-expanded="false"
            >

              <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M3.5 6l4.5 4 4.5-4" />
              </svg>
            </a>
            <ul class="dropdown-menu">
              <li>
                <a href="../Catalogo/catalogo.html#laminas">Laminas</a>
              </li>
              <li>
                <a href="../Catalogo/catalogo.html#pegatinas">Pegatinas</a>
              </li>
              <li><a href="../Catalogo/catalogo.html#textil">Textil</a></li>

          <li>
            <a class="nav-link" href="../Contacto/contacto.html">Contacto</a>
          </li>
        </ul>

        <div class="nav-actions">
          <a
            class="icon-button"
            href="../WorkingOnIt/working.html"
            aria-label="Ver carrito de compras"
          >
            <img
              class="icon-button-carrito"
              src="../Imagenes/carrito.png"
              alt="Carrito de compras"
            />
          </a>
          <a
            class="icon-button"
            href="../WorkingOnIt/working.html"
            aria-label="Iniciar sesion"
          >
            <img
              class="icon-button-login"
              src="../Imagenes/Login.png"
              alt="Inicio sesión"
            />
          </a>
        </div>

    <img class="banner" src="../Imagenes/Banner.jpg" alt="Banner de Momardi" />

        <div class="articulo">
          <img src="../Imagenes/Foto1.png" />
          <div class="informacionarticulo">
            <div class="tituloprecio">
              <h3>Teléfono</h3>
              <p>12€</p>
            </div>
            <div class="icon-button-carrito">
              <img src="../Imagenes/carrito.png" alt="Carrito de compras" />
            </div>
          </div>
        </div>

        <div class="articulo">
          <img src="../Imagenes/Foto2.png" />

            <div class="tituloprecio">

              <img src="../Imagenes/carrito.png" alt="Carrito de compras" />
            </div>
          </div>
        </div>

        <div class="articulo">
          <img src="../Imagenes/Foto3.png" />
          <div class="informacionarticulo">
            <div class="tituloprecio">
              <h3>Poción</h3>
              <p>12€</p>
            </div>
            <div class="icon-button-carrito">
              <img src="../Imagenes/carrito.png" alt="Carrito de compras" />
            </div>
          </div>
        </div>
      </div>
