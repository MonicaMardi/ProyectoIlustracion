<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momardi | Página en construcción</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: #f4f4f9;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .container {
        background: #ffffff;
        padding: 3rem 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        max-width: 500px;
        width: 100%;
      }
      .icon {
        font-size: 3.5rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.8rem;
        margin-bottom: 0.75rem;
        color: #1a1a1a;
      }
      p {
        font-size: 1rem;
        line-height: 1.5;
        color: #666;
        margin-bottom: 1.5rem;
      }
      .contact {
        font-size: 0.9rem;
        color: #888;
      }
      .contact a {
        color: #0066cc;
        text-decoration: none;
      }
      .contact a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">🚧</div>
      <h1>Estamos trabajando en ello</h1>
      <p>
        Nuestra página web está actualmente en construcción. Muy pronto
        estaremos disponibles con novedades.
      </p>
    </div>
  </body>
</html>
